## **2️⃣ GitHub Actions workflow (python-app.yml)**

This workflow will **lint with `ruff`** and **run pytest** on every push or pull request. It’s tuned for your project structure.

```yaml
name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pandas matplotlib

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Run tests
      run: |
        pytest
